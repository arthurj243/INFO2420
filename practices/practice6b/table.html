<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
<style>
   table, td, th {
      border: 1px solid black;
      border-collapse: separate;
      border-spacing: 5px;
      padding: 10px;
      border-radius: 1px;
   }
   .center {
      text-align: center; 
      margin: 0 auto;
      width: 90%;
   }
   caption {
      color: #003300;
      font-weight: bold;
      border-radius: 10px;
      height: 35px;
      text-align: center;
      font-size: 30px;
   }
   .courses {
      background-color: #CCCCCC;
      width: 40%;
   }
   th.days {
      background-color: #99ff66;
      width: 15%;
   }

</style>
<title>HTML Practice 6 - Tables</title>

<style type="text/css">


</style>
</head>
<body>
<div class="center">
   <table>
      <caption>My Class Schedule</caption>
      <colgroup class="courses">
         <col>
      </colgroup>
      <colgroup class="days">
         <col>
         <col>
         <col>
         <col>
         <col>
      </colgroup>
      <tr>
         <th>Courses</th>
         <th class="days">Monday</th>
         <th class="days">Tuesday</th>
         <th class="days">Wednesday</th>
         <th class="days">Thursday</th>
         <th class="days">Friday</th>
      </tr>
      <tr>
         <th>INFO 1120</th>
         <td>&nbsp;</td>
         <td>9-11</td>
         <td>&nbsp;</td>
         <td>9-11</td>
         <td rowspan="2">&nbsp;</td>
      </tr>
	   <tr>
         <th>Math 1010</th>
         <td colspan="4">12-1</td>
      </tr>
      <tr>
         <th>INFO 2420</th>
         <td colspan="5">Online Available 24/7</td>
      </tr>
   </table>
</div>



</body>
</html>
