<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style type="text/css">
    body {
        background-color: #FFFFFF;
        font-family: Arial, sans-serif;
        font-size: medium;
        color: #553100;
        margin: 20px;
    }
    h1 {
        color: #805215;
        font-size: xx-large;
    }
    h2 {
        color: #721330;
        font-size: x-large;
    }
    h3 {
        color: #721330;
        font-size: large;
    }
    p {
        color: #553100;
        font-size: medium;
    }
    blockquote {
        color: #721330;
        font-size: medium;
    }
    list {
        color: #553100;
        font-size: medium;
    }
    a:link {
        color: #721330;
        text-decoration: none;
    }
    a:visited {
        color: #721330;
        text-decoration: none;
    }
    a:hover {
        color: #805215;
        text-decoration: underline;
    }
    .header {
        color: white;
        width: 100%;
        background-color: #721330;
        padding-top: 10px;
        padding-bottom: 10px;
        text-align: center;
    }
    .floatleft {
        float: left;
        margin-right: 20px;
    }
    .floatright {
        float: right;
        margin-left: 20px;
    }
</style>

<title>Extreme Honeymoons - Graphics</title>
</head>
<body>
<img src="images/banner.png" alt="Extremem Honeymoons Banner">

</html>
